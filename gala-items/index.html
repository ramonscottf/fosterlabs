<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gala Items · Copy Tool</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --navy:#11194a; --red:#d72846; --indigo:#4d54b3; --gold:#f4b942;
    --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f5f7fb; --card:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;padding-bottom:40px;}
  a{color:var(--red);}

  header.bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:max(10px,env(safe-area-inset-top)) 14px 12px;box-shadow:0 4px 18px rgba(8,9,22,.18);}
  header .title{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;}
  header .title .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);}
  .search{margin-top:10px;display:flex;gap:8px;}
  .search input{flex:1;min-width:0;font-size:16px;padding:11px 14px;border-radius:11px;border:0;background:rgba(255,255,255,.14);color:#fff;}
  .search input::placeholder{color:rgba(255,255,255,.6);}
  .toolrow{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:rgba(255,255,255,.85);}
  .toolrow .count b{color:#fff;}
  .toolrow label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;}
  .toolrow input[type=checkbox]{width:16px;height:16px;accent-color:var(--gold);}

  .wrap{max-width:680px;margin:0 auto;padding:14px;}
  .empty{padding:50px 16px;text-align:center;color:var(--muted);}

  .item{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px;box-shadow:0 2px 10px rgba(13,27,61,.05);transition:opacity .2s;}
  .item.done{opacity:.5;}
  .item .top{display:flex;align-items:flex-start;gap:10px;padding:12px 14px 8px;}
  .item .num{font-size:12px;font-weight:800;color:#fff;background:var(--navy);border-radius:7px;padding:3px 8px;white-space:nowrap;}
  .item .ttl{font-weight:700;font-size:15.5px;flex:1;min-width:0;}
  .item .donebox{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;}
  .item .donebox input{width:18px;height:18px;accent-color:#16a34a;}
  .item .meta{padding:0 14px 6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .item .val{font-weight:800;color:var(--navy);font-size:13px;}
  .item .tag{font-size:10.5px;font-weight:600;color:var(--muted);background:#f1f5f9;border-radius:6px;padding:2px 7px;}

  .photo{position:relative;background:#0b1020;}
  .photo img.main{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#0b1020;}
  .photo .nodesc{display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;color:#475569;font-size:13px;background:#e2e8f0;}
  .thumbs{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;background:#0b1020;}
  .thumbs img{width:54px;height:34px;object-fit:cover;border-radius:6px;border:2px solid transparent;flex:0 0 auto;opacity:.6;cursor:pointer;}
  .thumbs img.sel{border-color:var(--gold);opacity:1;}

  .desc{padding:11px 14px 4px;font-size:13.5px;color:#334155;max-height:160px;overflow:auto;}
  .desc p{margin:0 0 8px;} .desc p:last-child{margin-bottom:0;}
  .desc ul,.desc ol{margin:0 0 8px;padding-left:20px;} .desc li{margin:0 0 4px;}
  .desc strong,.desc b{color:#0f172a;font-weight:700;} .desc em,.desc i{font-style:italic;}
  .desc.empty-d{color:#94a3b8;font-style:italic;}

  .btns{display:flex;gap:8px;padding:12px 14px 14px;}
  .btn{flex:1;font-family:inherit;font-weight:800;font-size:14px;padding:13px 10px;border-radius:12px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .1s,background .15s;}
  .btn:active{transform:scale(.97);}
  .btn.desc-b{background:#eef2ff;color:var(--indigo);}
  .btn.img-b{background:linear-gradient(95deg,var(--red),#883bb5 76%,var(--indigo));color:#fff;}
  .btn.ai-b{width:100%;background:linear-gradient(95deg,var(--indigo),var(--navy));color:#fff;}
  .btn.enh-b{width:100%;background:linear-gradient(95deg,var(--gold),#e0972b);color:#3a2a00;}
  .btn.ad-b{width:100%;background:linear-gradient(95deg,#7c3aed,#4d54b3);color:#fff;}
  .adout{padding:2px 14px 8px;display:flex;flex-direction:column;gap:12px;}
  .adtile img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#0b1020;display:block;}
  .adtile figcaption{font-size:12px;color:var(--muted);padding-top:5px;}
  .adtile a{color:var(--indigo);font-weight:700;text-decoration:none;}
  .adtile .adcopy{font:inherit;font-size:12px;font-weight:700;color:var(--indigo);background:none;border:0;cursor:pointer;padding:0;}
  .adtile .adfixrow{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;}
  .adtile .adfix{font:inherit;font-size:11.5px;font-weight:700;color:#6d28d9;background:#f3f0ff;border:0;border-radius:7px;padding:4px 9px;cursor:pointer;}
  .adtile .adfix:active{transform:scale(.96);}
  .airow{padding:0 14px 0;}
  .btn.ok{background:#16a34a!important;color:#fff!important;}
  .copytitle{display:block;width:100%;text-align:center;background:none;border:0;color:var(--muted);font-size:12px;padding:0 14px 12px;cursor:pointer;}

  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.3);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<header class="bar">
  <div class="title"><span class="dot"></span> Gala Items · Copy Tool</div>
  <div class="search"><input id="q" type="search" placeholder="Search by #, title, or tag…" autocomplete="off"></div>
  <div class="toolrow">
    <span class="count" id="count">Loading…</span>
    <label><input type="checkbox" id="rwonly"> ✨ Rewritten only</label>
    <label><input type="checkbox" id="hidedone"> Hide done</label>
  </div>
</header>

<div class="wrap"><div id="list"><div class="empty">Loading items…</div></div></div>
<div id="toast"></div>

<script>
const DATA_URL = "https://gala.daviskids.org/data/auction-items.json";
const PROXY = u => "/api/img?u=" + encodeURIComponent(u);
let ITEMS = [];
let SAVED_IMAGES = {};
const DONE = new Set(JSON.parse(localStorage.getItem("galaItemsDone") || "[]"));
const saveDone = () => localStorage.setItem("galaItemsDone", JSON.stringify([...DONE]));
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1600); }
function flash(btn,label){ const o=btn.dataset.label||btn.textContent; btn.dataset.label=o; btn.textContent=label; btn.classList.add("ok"); setTimeout(()=>{btn.textContent=o;btn.classList.remove("ok");},1400); }

async function copyText(txt, btn, okLabel){
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.focus(); ta.select(); try{document.execCommand("copy");}catch(_){} ta.remove(); }
  flash(btn, okLabel); toast(okLabel);
}

function toMarkdown(html){
  if(!html) return "";
  const doc = new DOMParser().parseFromString(html, "text/html");
  function walk(node){
    let out="";
    node.childNodes.forEach(n=>{
      if(n.nodeType===3){ out += n.textContent; return; }
      if(n.nodeType!==1) return;
      const tag=n.tagName.toLowerCase(), inner=walk(n);
      if(tag==="p") out += inner.trim()+"\n\n";
      else if(tag==="br") out += "\n";
      else if(tag==="ul"||tag==="ol") out += "\n"+inner+"\n";
      else if(tag==="li") out += "- "+inner.trim()+"\n";
      else if(tag==="strong"||tag==="b") out += "**"+inner.trim()+"**";
      else if(tag==="em"||tag==="i") out += "*"+inner.trim()+"*";
      else out += inner;
    });
    return out;
  }
  return walk(doc.body).replace(/\n{3,}/g,"\n\n").trim();
}
function pngFrom(blob){
  if(blob.type==="image/png") return Promise.resolve(blob);
  return createImageBitmap(blob).then(bmp=>{ const c=document.createElement("canvas"); c.width=bmp.width; c.height=bmp.height; c.getContext("2d").drawImage(bmp,0,0); return new Promise(r=>c.toBlob(r,"image/png")); });
}
async function copyImage(url, btn){
  if(navigator.clipboard && window.ClipboardItem){
    try{
      const png = fetch(PROXY(url)).then(r=>{ if(!r.ok) throw new Error("proxy"); return r.blob(); }).then(pngFrom);
      await navigator.clipboard.write([ new ClipboardItem({ "image/png": png }) ]);
      flash(btn,"Photo copied ✓"); toast("Photo copied ✓"); return;
    }catch(e){ /* fall through */ }
  }
  // Fallback: copy the image URL + tell them to long-press
  try{ await navigator.clipboard.writeText(url); }catch(_){}
  flash(btn,"URL copied"); toast("Long-press the photo to copy it");
}

async function aiRewrite(it, card, btn){
  const orig = btn.dataset.orig || btn.textContent;
  btn.dataset.orig = orig;
  btn.disabled = true; btn.textContent = "✨ Writing…";
  try{
    const r = await fetch("/api/gala-rewrite", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ id: it.id, title: it.title, desc: (it._orig || it.desc || ""), value: it.value, tags: it.tags||[] })
    });
    const d = await r.json();
    if(!r.ok || !d.desc_html) throw new Error(d.error || ("HTTP "+r.status));
    it.desc_html = d.desc_html;
    it.desc = d.desc_html.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
    it._rw = true;
    const descEl = card.querySelector(".desc");
    if(descEl){ descEl.classList.remove("empty-d"); descEl.innerHTML = d.desc_html; }
    const meta = card.querySelector(".meta");
    if(meta && !meta.querySelector(".rw-badge")){
      const s=document.createElement("span"); s.className="tag rw-badge";
      s.style.cssText="background:#fef3c7;color:#92400e;border:1px solid #fde68a"; s.textContent="✨ rewritten";
      meta.insertBefore(s, meta.firstChild);
    }
    document.getElementById("count").innerHTML = `Showing <b>${document.querySelectorAll(".item").length}</b> · ✨ <b>${ITEMS.filter(x=>x._rw).length}</b> · Done <b>${DONE.size}</b>/${ITEMS.length}`;
    toast("New copy ready ✓"); btn.textContent = "✨ Rewrite again";
  }catch(e){
    toast("Rewrite failed — "+(e.message||e)); btn.textContent = orig;
  }finally{ btn.disabled = false; }
}

async function pollImage(taskId, btn){
  const start = Date.now(); let delay = 2500;
  while(Date.now() - start < 120000){
    await new Promise(r=>setTimeout(r, delay));
    let d; try{ d = await (await fetch("/api/gala-image?taskId="+encodeURIComponent(taskId), {cache:"no-store"})).json(); }catch(_){ d={}; }
    if(d.state==="success" && d.imageUrl) return d.imageUrl;
    if(d.state==="fail") throw new Error(d.failMsg || "generation failed");
    if(btn) btn.textContent = "🎨 "+(d.state||"working")+"…";
    delay = Math.min(delay+1000, 6000);
  }
  throw new Error("timed out");
}

async function enhanceImage(it, card, btn){
  const imgs = it.images||[];
  if(!imgs.length){ toast("No photo to enhance"); return; }
  const src = (card.querySelector("img.main")||{}).src || imgs[0];
  const orig = btn.dataset.orig || btn.textContent; btn.dataset.orig = orig;
  btn.disabled = true; btn.textContent = "🎨 Submitting…";
  try{
    const r = await fetch("/api/gala-image", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:it.id, imageUrl:src})});
    const d = await r.json();
    if(!r.ok || !d.taskId) throw new Error(d.error || ("HTTP "+r.status));
    btn.textContent = "🎨 Generating…";
    const url = await pollImage(d.taskId, btn);
    const mainImg = card.querySelector("img.main");
    if(mainImg) mainImg.src = url;
    saveGenerated(it.id, "enhanced", url);
    // make original + enhanced both reachable as thumbnails (tap to revert/compare)
    let thumbs = card.querySelector(".thumbs");
    if(!thumbs){
      thumbs = document.createElement("div"); thumbs.className = "thumbs";
      const o = document.createElement("img"); o.src = imgs[0]; o.dataset.u = imgs[0]; o.alt = "";
      thumbs.appendChild(o);
      card.querySelector(".photo").insertAdjacentElement("afterend", thumbs);
    }
    thumbs.querySelectorAll("img").forEach(x=>x.classList.remove("sel"));
    const t = document.createElement("img"); t.src = url; t.dataset.u = url; t.className = "sel"; t.alt = "";
    thumbs.appendChild(t);
    toast("Enhanced ✓ — tap a thumbnail to compare"); btn.textContent = "🎨 Enhance again";
  }catch(e){
    toast("Enhance failed — "+(e.message||e)); btn.textContent = orig;
  }finally{ btn.disabled = false; }
}

// Structured product brief pulled from the item's rewritten copy (product-ad-pair-generator skill)
function adBrief(it){
  const doc = new DOMParser().parseFromString(it.desc_html || "", "text/html");
  let headline = "";
  const firstStrong = doc.querySelector("p strong, strong");
  if(firstStrong) headline = firstStrong.textContent;
  if(!headline) headline = it.title || "";
  headline = headline.replace(/\s+/g,' ').trim().split(/\s+[—–-]\s+/)[0].trim();
  const ems = [...doc.querySelectorAll("em, i")];
  const tagline = ems.length ? ems[ems.length-1].textContent.replace(/\s+/g,' ').trim() : "";
  const bullets = [...doc.querySelectorAll("li")].map(li=>{
    const lab = li.querySelector("strong, b");
    return { label: lab ? lab.textContent.replace(/\s+/g,' ').trim() : "", text: li.textContent.replace(/\s+/g,' ').trim() };
  });
  const items = bullets.map(b=>b.text).filter(Boolean).slice(0,8);
  const subline = (bullets[0] && bullets[0].label) ? bullets[0].label : (it.title||"").replace(/\s+/g,' ').trim();
  return { title:(it.title||"").trim(), headline, subline, tagline, items };
}
const PRESERVE = "Use the reference image as the SOURCE OF TRUTH for product identity. Preserve the exact product identity, brand logos, labels, packaging, colors, proportions and included items. Do not redesign, recolor, simplify or replace any product, logo, label or packaging. Do not invent extra products.";
const AD_SCENE = (it, hint)=>{
  const b = adBrief(it);
  const itemsBlock = b.items.length ? `\nIncluded items (show accurately, do not add or omit):\n- ${b.items.join("\n- ")}` : "";
  return `Please create a premium 16:9 aspirational product advertisement. ${PRESERVE} (Preserve all real logos and packaging — this matters.)

Product: ${b.title}${itemsBlock}
Setting: ${hint ? hint : "an attractive real-world setting that suits the product"}, warm polished golden-hour commercial lighting.

Show the product being used naturally or just-finished, prominent and accurate. If a person is included, one attractive adult in stylish, natural, believable clothing, secondary to the product and clearly enjoying it. Clean, elevated, photorealistic retail-ad feel.

Minimal ad copy only — render text crisply and spell it EXACTLY as written, placed tastefully with generous negative space (upper-left works well):
Headline: "${b.headline}"
Subline: "${b.subline}"${b.tagline ? `\nSmall detail line: "${b.tagline}"` : ""}
No clutter, no gibberish text, no watermark. ${PRESERVE}`;
};
const AD_WHITE = (it)=>{
  const b = adBrief(it);
  const itemsBlock = b.items.length ? `\nArrange ALL included items clearly, front-facing labels where possible:\n- ${b.items.join("\n- ")}` : "";
  return `Please create a clean 16:9 studio product hero image on a seamless white background with soft realistic shadowing. ${PRESERVE} (Preserve all real logos and packaging — this matters.)

Product: ${b.title}${itemsBlock}

Balanced, premium, catalog-ready and uncluttered, with clean spacing and no lifestyle props. Little or no text — at most a small, clean product title rendered crisply and spelled EXACTLY in the upper-left: "${b.title}". No other text or graphics. ${PRESERVE}`;
};

const AD_JOBS = {};
const AD_FIX = {
  fidelity: "Regenerate with stricter product fidelity. The product must match the reference image more closely. Preserve the exact shape, colors, logos, labels and packaging. Do not invent or alter the product.",
  text: "Regenerate with less text. Keep only the headline and one short subline. Remove any feature blocks or long copy.",
  labels: "Regenerate with packaging treated as visual branding rather than rewritten text. Keep labels recognizable and front-facing, but do not invent new words."
};

function renderTileCaption(fig, rr){
  const cap = fig.querySelector("figcaption"); if(!cap) return;
  const fn = "gala-"+esc(String(rr.id))+"-"+esc(String(rr.label).toLowerCase().replace(/\s+/g,"-"))+".png";
  let html = `<b>${esc(rr.label)}</b> · <a href="${PROXY(rr.url)}" download="${fn}">download</a> · <button class="adcopy" data-u="${esc(rr.url)}">copy</button>`;
  if(rr.taskId) html += `<div class="adfixrow"><button class="adfix" data-tid="${esc(rr.taskId)}" data-kind="fidelity">↻ fidelity</button><button class="adfix" data-tid="${esc(rr.taskId)}" data-kind="text">↻ less text</button><button class="adfix" data-tid="${esc(rr.taskId)}" data-kind="labels">↻ labels</button></div>`;
  cap.innerHTML = html;
}

function saveGenerated(id, label, url){
  try{
    const k = String(id);
    if(!SAVED_IMAGES[k]) SAVED_IMAGES[k] = [];
    if(!SAVED_IMAGES[k].some(x=>x.url===url)) SAVED_IMAGES[k].unshift({url, label, ts:Date.now()});
    SAVED_IMAGES[k] = SAVED_IMAGES[k].slice(0,8);
  }catch(_){}
  fetch("/api/gala-images", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id, label, url})}).catch(()=>{});
}

function populateSavedImages(){
  document.querySelectorAll(".item").forEach(card=>{
    const id = card.dataset.id;
    const out = card.querySelector(".adout");
    const saved = SAVED_IMAGES[id];
    if(!out || out.children.length || !saved || !saved.length) return;
    saved.forEach(rr=>{
      const fig = document.createElement("figure"); fig.className = "adtile";
      const im = document.createElement("img"); im.src = rr.url; im.alt = "";
      fig.appendChild(im); fig.appendChild(document.createElement("figcaption"));
      out.appendChild(fig);
      renderTileCaption(fig, {label:rr.label||"saved", url:rr.url, taskId:"", id});
    });
  });
}

async function aiAdPair(it, card, btn){
  const imgs = it.images||[];
  if(!imgs.length){ toast("No photo to use"); return; }
  const src = (card.querySelector("img.main")||{}).src || imgs[0];
  const orig = btn.dataset.orig || btn.textContent; btn.dataset.orig = orig;
  btn.disabled = true; btn.textContent = "✨ Submitting 2…";
  const out = card.querySelector(".adout"); if(out) out.innerHTML = "";
  const hint = ((card.querySelector(".adprompt")||{}).value || "").trim();
  const jobs = [{label:"Aspirational", prompt:AD_SCENE(it, hint)}, {label:"White studio", prompt:AD_WHITE(it)}];
  try{
    const submitted = await Promise.all(jobs.map(async j=>{
      const r = await fetch("/api/gala-image", {method:"POST",headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ id:it.id, imageUrl:src, model:"nano-banana-pro", aspect_ratio:"16:9", resolution:"2K", prompt:j.prompt })});
      const d = await r.json();
      if(!r.ok || !d.taskId) throw new Error(d.error || ("HTTP "+r.status));
      return { ...j, taskId:d.taskId };
    }));
    btn.textContent = "✨ Generating 2…";
    const results = await Promise.all(submitted.map(j => pollImage(j.taskId).then(url=>({label:j.label, url, taskId:j.taskId, basePrompt:j.prompt}))));
    if(out){
      out.innerHTML = "";
      results.forEach(rr=>{
        AD_JOBS[rr.taskId] = { basePrompt: rr.basePrompt, src, label: rr.label, id: it.id };
        saveGenerated(it.id, rr.label, rr.url);
        const fig = document.createElement("figure"); fig.className = "adtile"; fig.dataset.tid = rr.taskId;
        const im = document.createElement("img"); im.src = rr.url; im.alt = "";
        fig.appendChild(im); fig.appendChild(document.createElement("figcaption"));
        out.appendChild(fig);
        renderTileCaption(fig, {label:rr.label, url:rr.url, taskId:rr.taskId, id:it.id});
      });
    }
    toast("2 ad images ready ✓"); btn.textContent = "✨ Make 2 again";
  }catch(e){
    toast("Ad gen failed — "+(e.message||e)); btn.textContent = orig;
  }finally{ btn.disabled = false; }
}

async function adCorrect(tid, kind, card){
  const job = AD_JOBS[tid]; if(!job){ toast("Can't find that image to redo"); return; }
  const fig = card.querySelector('.adtile[data-tid="'+tid+'"]'); if(!fig) return;
  const cap = fig.querySelector("figcaption"); const old = cap ? cap.innerHTML : "";
  if(cap) cap.innerHTML = "↻ regenerating…";
  try{
    const prompt = job.basePrompt + "\n\n" + (AD_FIX[kind] || AD_FIX.fidelity);
    const r = await fetch("/api/gala-image", {method:"POST",headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ id:job.id, imageUrl:job.src, model:"nano-banana-pro", aspect_ratio:"16:9", resolution:"2K", prompt })});
    const d = await r.json();
    if(!r.ok || !d.taskId) throw new Error(d.error || ("HTTP "+r.status));
    const url = await pollImage(d.taskId);
    AD_JOBS[d.taskId] = { basePrompt: job.basePrompt, src: job.src, label: job.label, id: job.id };
    fig.dataset.tid = d.taskId;
    const im = fig.querySelector("img"); if(im) im.src = url;
    renderTileCaption(fig, {label:job.label, url, taskId:d.taskId, id:job.id});
    saveGenerated(job.id, job.label, url);
    toast("Redone ✓");
  }catch(e){
    toast("Redo failed — "+(e.message||e)); if(cap) cap.innerHTML = old;
  }
}

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const hide = document.getElementById("hidedone").checked;
  const rwonly = document.getElementById("rwonly").checked;
  let list = ITEMS;
  if(q) list = list.filter(it => (it.number+" "+it.title+" "+(it.tags||[]).join(" ")).toLowerCase().includes(q));
  if(hide) list = list.filter(it => !DONE.has(String(it.id)));
  if(rwonly) list = list.filter(it => it._rw);

  const rwCount = ITEMS.filter(it=>it._rw).length;
  document.getElementById("count").innerHTML = `Showing <b>${list.length}</b> · ✨ <b>${rwCount}</b> · Done <b>${DONE.size}</b>/${ITEMS.length}`;
  const wrap = document.getElementById("list");
  if(!list.length){ wrap.innerHTML = `<div class="empty">No items match.</div>`; return; }

  wrap.innerHTML = list.map(it=>{
    const id = String(it.id);
    const done = DONE.has(id);
    const imgs = it.images||[];
    const main = imgs.length ? `<img class="main" src="${esc(imgs[0])}" alt="" loading="lazy">` : `<div class="nodesc">No photo</div>`;
    const thumbs = imgs.length>1 ? `<div class="thumbs">${imgs.map((u,i)=>`<img src="${esc(u)}" data-u="${esc(u)}" class="${i===0?'sel':''}" alt="">`).join("")}</div>` : "";
    const tags = (it.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
    const desc = it.desc_html ? it.desc_html : (it.desc ? esc(it.desc) : "No description.");
    return `<div class="item ${done?'done':''}" data-id="${id}">
      <div class="top">
        <span class="num">#${esc(it.number||"?")}</span>
        <div class="ttl">${esc(it.title)}</div>
        <label class="donebox"><input type="checkbox" class="done-cb" ${done?'checked':''}> done</label>
      </div>
      <div class="meta">${it.value?`<span class="val">${esc(it.value)}</span>`:""}${it._rw?`<span class="tag rw-badge" style="background:#fef3c7;color:#92400e;border:1px solid #fde68a">✨ rewritten</span>`:""}${tags}</div>
      <div class="photo">${main}</div>
      ${thumbs}
      <div class="desc ${it.desc?'':'empty-d'}">${desc}</div>
      <div class="airow"><button class="btn ai-b" data-act="ai">✨ Rewrite with AI</button></div>
      <div class="airow" style="padding-top:8px"><button class="btn enh-b" data-act="enh" ${imgs.length?'':'disabled style="opacity:.4"'}>🎨 Enhance photo with AI</button></div>
      <div class="airow" style="padding-top:8px"><input class="adprompt" type="text" placeholder="optional scene hint (e.g. alpine lakeside at sunrise)…" style="width:100%;font:inherit;font-size:13px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)"></div>
      <div class="airow" style="padding-top:8px"><button class="btn ad-b" data-act="adpair" ${imgs.length?'':'disabled style="opacity:.4"'}>✨ Ad pair: scene + white (16:9)</button></div>
      <div class="btns">
        <button class="btn desc-b" data-act="desc">📋 Copy description</button>
        <button class="btn img-b" data-act="img" ${imgs.length?'':'disabled style=opacity:.4'}>🖼 Copy photo</button>
      </div>
      <button class="copytitle" data-act="title">copy title only</button>
      <div class="adout"></div>
    </div>`;
  }).join("");
  populateSavedImages();
}

document.addEventListener("click", e=>{
  const card = e.target.closest(".item"); if(!card) return;
  const id = card.dataset.id;
  const it = ITEMS.find(x=>String(x.id)===id); if(!it) return;

  const thumb = e.target.closest(".thumbs img");
  if(thumb){ card.querySelector("img.main").src = thumb.dataset.u; card.querySelectorAll(".thumbs img").forEach(t=>t.classList.toggle("sel",t===thumb)); return; }

  const ac = e.target.closest(".adcopy");
  if(ac){ copyImage(ac.dataset.u, ac); return; }

  const fx = e.target.closest(".adfix");
  if(fx){ adCorrect(fx.dataset.tid, fx.dataset.kind, card); return; }

  const btn = e.target.closest("[data-act]");
  if(btn){
    const act = btn.dataset.act;
    if(act==="desc") copyText(toMarkdown(it.desc_html||"") || it.desc || "", btn, "Description copied ✓");
    else if(act==="title") copyText(it.title||"", btn, "Title copied ✓");
    else if(act==="ai") aiRewrite(it, card, btn);
    else if(act==="enh") enhanceImage(it, card, btn);
    else if(act==="adpair") aiAdPair(it, card, btn);
    else if(act==="img"){ const cur = (card.querySelector("img.main")||{}).src || (it.images||[])[0]; if(cur) copyImage(cur, btn); }
    return;
  }
});

document.addEventListener("change", e=>{
  if(e.target.classList.contains("done-cb")){
    const card = e.target.closest(".item"); const id = card.dataset.id;
    if(e.target.checked){ DONE.add(id); card.classList.add("done"); } else { DONE.delete(id); card.classList.remove("done"); }
    saveDone();
    document.getElementById("count").innerHTML = `Showing <b>${document.querySelectorAll(".item").length}</b> · Done <b>${DONE.size}</b>/${ITEMS.length}`;
    if(document.getElementById("hidedone").checked && e.target.checked) setTimeout(render,250);
  }
  if(e.target.id==="hidedone" || e.target.id==="rwonly") render();
});
document.getElementById("q").addEventListener("input", ()=>{ clearTimeout(window.__qt); window.__qt=setTimeout(render,120); });

(async ()=>{
  try{
    const r = await fetch(DATA_URL, {cache:"no-store"});
    const d = await r.json();
    ITEMS = (d.items||[]).slice().sort((a,b)=> (parseInt(a.number)||0)-(parseInt(b.number)||0));
    ITEMS.forEach(it=>{ it._orig = it.desc; });
    const applyOverlay = (rw)=>{ ITEMS.forEach(it=>{ const o = rw[String(it.id)]; if(o){ if(o.desc_html) it.desc_html = o.desc_html; if(o.desc!=null) it.desc = o.desc; it._rw = true; } }); };
    try{ const rr = await fetch("./rewrites.json", {cache:"no-store"}); if(rr.ok) applyOverlay(await rr.json()); }catch(_){}
    try{ const sr = await fetch("/api/gala-rewrites", {cache:"no-store"}); if(sr.ok) applyOverlay(await sr.json()); }catch(_){}
    try{ const ir = await fetch("/api/gala-images", {cache:"no-store"}); if(ir.ok) SAVED_IMAGES = await ir.json(); }catch(_){}
    render();
  }catch(e){
    document.getElementById("list").innerHTML = `<div class="empty">Couldn't load items.<br><small>${esc(e.message||e)}</small></div>`;
    document.getElementById("count").textContent = "Error";
  }
})();
</script>
</body>
</html>
